services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-work-queues
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"             # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"   # Management UI (guest / guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rabbitmq-data:
